<!doctype html>
<html lang="ko">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        color: #172033;
        background: #f6f8fc;
        font: 14px/1.55 Arial, sans-serif;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 20px;
      }

      p {
        margin: 0 0 16px;
        color: #526075;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #c9d2e3;
        border-radius: 9px;
        background: #fff;
        font: 13px Consolas, monospace;
      }

      input:focus {
        border-color: #536dfe;
        outline: 3px solid rgba(83, 109, 254, 0.14);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }

      button {
        padding: 9px 16px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }

      .cancel {
        color: #455268;
        background: #e7ebf3;
      }

      .save {
        color: #fff;
        background: #4054d8;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 22px;
        margin-top: 12px;
        font-size: 13px;
      }

      .error {
        color: #b42318;
      }

      .success {
        color: #067647;
      }
    </style>
  </head>
  <body>
    <h2>Supabase 서버 키 설정</h2>
    <p>입력한 키는 Script Properties에만 저장됩니다. 소스 코드, 시트, 로그에는 기록하지 않습니다.</p>

    <label for="secretKey">Secret API key</label>
    <input
      id="secretKey"
      type="password"
      autocomplete="off"
      spellcheck="false"
      placeholder="sb_secret_..."
      autofocus
    >

    <div class="actions">
      <button class="cancel" type="button" onclick="google.script.host.close()">취소</button>
      <button class="save" id="saveButton" type="button" onclick="saveSecret()">안전하게 저장</button>
    </div>
    <div id="status" aria-live="polite"></div>

    <script>
      function saveSecret() {
        var input = document.getElementById('secretKey');
        var button = document.getElementById('saveButton');
        var status = document.getElementById('status');
        var value = input.value.trim();

        if (!value) {
          status.className = 'error';
          status.textContent = '서버 키를 입력해 주세요.';
          input.focus();
          return;
        }

        button.disabled = true;
        status.className = '';
        status.textContent = '저장 상태를 확인하고 있습니다...';

        google.script.run
          .withSuccessHandler(function(result) {
            input.value = '';
            status.className = 'success';
            status.textContent = result.message;
            setTimeout(function() {
              google.script.host.close();
            }, 1200);
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            status.className = 'error';
            status.textContent = error && error.message ? error.message : '서버 키 저장에 실패했습니다.';
            input.focus();
          })
          .saveSupabaseSecretFromUi(value);
      }

      document.getElementById('secretKey').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          saveSecret();
        }
      });
    </script>
  </body>
</html>
